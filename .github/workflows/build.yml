name: Build dinput8

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build DLL
        shell: cmd
        run: |
          if not exist build mkdir build

          cl /nologo /std:c++23 /EHsc /LD ^
            /I include ^
            src\DS3Probe.cpp ^
            include\safetyhook\safetyhook.cpp ^
            include\safetyhook\Zydis.c ^
            /link ^
            /DEF:src\dinput8.def ^
            /OUT:build\dinput8.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: dinput8-win32
          path: build\dinput8.dll
