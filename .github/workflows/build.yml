name: Build DS3Probe

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32, Release)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Upload dinput8.dll
        uses: actions/upload-artifact@v4
        with:
          name: dinput8
          path: |
            build/Release/dinput8.dll
            README.md
            ds3probe.cfg.example
            ds3probe_camdump.cfg.example
            tools/analyze_di.py
