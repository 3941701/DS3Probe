name: Build dinput8

on:
  push:
    branches: [ "main", "master" ] # Сборка будет запускаться автоматически при пуше
  workflow_dispatch:            # И вручную кнопкой

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build DLL
        shell: cmd
        run: |
          if not exist build mkdir build

          cl /nologo /O2 /std:c++20 /EHsc /LD ^
            /I include ^
            /I include\safetyhook ^
            src\DS3Probe.cpp ^
            include\safetyhook\Zydis.c ^
            /link ^
            /DEF:src\dinput8.def ^
            /OUT:build\dinput8.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: dinput8-win32
          path: build\dinput8.dll
